# Load balancer in front of the `web` replicas.
#
# Compose's internal DNS resolves `web` to every replica's address, so nginx
# round-robins across them without being told how many there are — which is why
# `--scale web=N` needs no change here.

# Which replica served the request, and how long it took. An access log that
# cannot answer "which instance" is of little use once there is more than one,
# and it is the only way to see that balancing is happening at all — the health
# endpoints skip the application's own logging.
log_format upstream '$remote_addr $request_method $uri $status '
                    'upstream=$upstream_addr time=$upstream_response_time '
                    'correlation=$http_x_correlation_id';

access_log /var/log/nginx/access.log upstream;

upstream wagoe_web {
    # `resolve` is an nginx-plus directive; on open-source nginx the address is
    # resolved once at start-up. Restarting the lb after scaling is enough for a
    # reference topology, and the alternative — a resolver + variable upstream —
    # obscures the thing this file is meant to show.
    server web:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 8080;

    # An unready replica answers 503 on /health/ready. Passing that through
    # rather than translating it is deliberate: a load balancer that reports a
    # degraded backend as healthy is the failure this endpoint exists to make
    # visible.
    location /health/ready {
        proxy_pass http://wagoe_web;
        proxy_next_upstream off;
    }

    location / {
        proxy_pass http://wagoe_web;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Correlation ids are generated per request when absent, so a client
        # that supplies one keeps it across the hop — the same header the RPC
        # adapter propagates between services.
        proxy_set_header X-Correlation-Id  $http_x_correlation_id;

        # Retry the next replica only for a connection that was never
        # established. `http_500` and friends are deliberately absent: replaying
        # a POST that already reached a replica is how a payment gets taken
        # twice.
        proxy_next_upstream error timeout;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # WebSockets, for the realtime module. Note that realtime pub/sub is not yet
    # replica-safe: a socket connected to replica A does not see an event
    # published on replica B. Sticky sessions do not fix it — see scaling.adoc.
    location /ws {
        proxy_pass http://wagoe_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
}
