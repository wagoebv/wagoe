# Reference topology: N web replicas behind a load balancer, plus a worker.
#
# What this is for: running more than one instance of the application. Anything
# that only works with a single process shows up here and nowhere else — a
# session held in memory, a rate limit counted per JVM, a scheduled job that
# fires N times because N replicas each started it.
#
#   docker build -t wagoe:latest .
#   docker compose -f deploy/compose/multi-instance.yml up -d --scale web=3
#   curl -i http://localhost:8080/health/ready
#
# The application image is built from the repository root Dockerfile. `web` has
# no published port: the load balancer is the only way in, which is what makes
# the replicas real rather than decorative.

name: wagoe-multi-instance

x-app-env: &app-env
  WAG_ENV: prod
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 characters}
  # The prod profile reads POSTGRES_*, not DB_*. Getting this wrong fails the
  # boot at :wagoe/db-context with "Invalid database configuration" — which is
  # what the shipped k8s manifest did until this ticket.
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: wagoe
  POSTGRES_USER: wagoe
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagoe}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Matches --requirepass on the redis service below. A blank value would be
  # worse than useless: it is truthy, so the client would authenticate against
  # a server expecting none — and the resulting AUTH error names Redis, sending
  # you to look at the server rather than at this variable. (The adapter now
  # treats blank as absent; the reference still sets a real password, because a
  # passwordless Redis on a shared network is not a thing to model.)
  REDIS_PASSWORD: ${REDIS_PASSWORD:-wagoe-redis}
  # No Sentry in a local reference. Set deliberately rather than left unset:
  # the prod profile defaults to :sentry and refuses to start without a DSN,
  # which is right — a deployment that forgot to configure error reporting
  # should fail loudly. A real deployment removes this line and sets SENTRY_DSN.
  ERROR_REPORTING_PROVIDER: "no-op"
  # Off, and it cannot be switched on from here. Rate limiting in :prod refuses
  # to boot without a reachable cache (BOU-173) — correct, since a limit counted
  # per replica is not a limit — and :wagoe/cache ships under :inactive in
  # resources/conf/prod/config.edn. Moving it to :active is an edit to the
  # application's own config, not an environment variable, so a reference
  # topology cannot do it for you. Redis is deployed here so that the moment you
  # do, there is something to point at.
  HTTP_RATE_LIMIT_ENABLED: "false"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wagoe
      POSTGRES_USER: wagoe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagoe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagoe -d wagoe"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes",
              "--requirepass", "${REDIS_PASSWORD:-wagoe-redis}"]
    volumes:
      - redisdata:/data
    healthcheck:
      # -a, or the probe fails against the password this server now requires
      # and the stack never comes up.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-wagoe-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: wagoe:latest
    command: ["server"]
    environment: *app-env
    # No `ports:` — reachable only through the load balancer, so scaling this
    # service cannot collide on a host port and every request goes through the
    # path a real deployment uses.
    expose:
      - "3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # The image's own healthcheck already calls /health/ready; repeated here
      # so `depends_on: service_healthy` below has something to wait for.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s
    deploy:
      replicas: 2

  worker:
    image: wagoe:latest
    command: ["worker"]
    environment: *app-env
    # The image's HEALTHCHECK curls /health/ready, and worker mode binds no
    # listener — so an entirely healthy worker reports unhealthy, and anything
    # watching container health treats a working process as a failing one.
    # There is no HTTP surface to probe instead: liveness for a worker is the
    # process being alive, which the runtime already tracks.
    healthcheck:
      disable: true
    # One. Scheduled work is not yet leader-elected, so N workers run every job
    # N times — see scaling.adoc. This is the constraint, not an oversight.
    deploy:
      replicas: 1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  lb:
    image: nginx:1.27-alpine
    ports:
      - "${LB_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
