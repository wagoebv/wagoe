name: Clojure deps
description: >-
  Set up the Clojure CLI, restore the shared dependency cache, and serially
  prefetch deps to avoid the Maven concurrent-resolution crash.

inputs:
  aliases:
    description: >-
      Space-separated -M alias strings to prefetch serially
      (e.g. "-M:test" or "-M:migrate -M:test"). Use "-" for the base deps with
      no alias, which is what the isolation matrix resolves.
    required: true
  also-warm:
    description: >-
      Space-separated directory globs whose own `deps.edn` to resolve as well,
      after the aliases above. `warm-deps` passes "libs/*" so the shared cache
      holds what the isolation matrix reads: a library pins its own versions, so
      53 artifacts the 30 cells need are in no root alias closure and every cell
      fetched them from Central concurrently, uncached (BOU-441).
    required: false
    default: ""
  working-directory:
    description: >-
      Where to resolve. A job that runs its command in a library directory
      resolves that library's deps.edn, and prefetching the root instead left
      that resolution unretried — which is how a Maven 403 failed `Test
      wagoe/config` and the isolation matrix under an innocent library's name
      (BOU-417).
    required: false
    default: "."
  skip-on-hit:
    description: >-
      "true" skips the prefetch on an exact cache hit. Only `warm-deps` sets it:
      it is the only job that can save a key, so an exact hit means a previous
      warm-deps already resolved everything it would resolve now (BOU-527).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Pinned here rather than per job: only `e2e` set up a JDK at all, so the
    # other jobs ran on whatever the runner image happens to default to — which
    # is not the baseline the installer, the Dockerfiles and `wagoe doctor`
    # require. `bb check:jdk` holds this number to the rest (BOU-446).
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        cli: 1.12.6.1673

    # The `v2` segment is a manual invalidation lever, and it is load-bearing.
    #
    # actions/cache only WRITES on an exact-key miss. Before the warm-deps job
    # existed, lint (deps: just -M:clj-kondo) raced the other root jobs and won,
    # saving a ~12MB stub under this key. Adding warm-deps stopped new keys being
    # poisoned but could not heal that one: warm-deps kept getting an exact hit,
    # so it restored the stub, downloaded into ~/.m2, and never saved — leaving
    # every downstream job to pull the full :test tree from Maven Central and get
    # 429-ed. The key is pinned by hashFiles(**/deps.edn), so it would have
    # stayed poisoned until a dependency changed.
    #
    # Bump this segment whenever a cache is known-bad *or* when what belongs in
    # it changes; it mints a fresh key that warm-deps then populates properly.
    #
    # v3: BOU-441 added each library's own deps.edn to what warm-deps resolves,
    # 60 artifacts the root closures never held. That changes the contents and
    # not a single deps.edn, so hashFiles produced the same key, warm-deps got an
    # exact hit and never saved — the expansion would have reached no other job
    # until some dependency happened to change. "Known-bad" was too narrow a
    # reason to bump, which is how that was missed in review.
    - name: Cache dependencies
      id: cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-clojure-v3-${{ hashFiles('**/deps.edn') }}
        restore-keys: ${{ runner.os }}-clojure-v3-

    # Resolve deps single-threaded BEFORE any concurrent resolution. On a cold
    # ~/.m2, tools.deps parses many JDBC-driver POMs in parallel and intermittently
    # trips a Maven DefaultModelValidator concurrency bug (HashMap$Node cannot be
    # cast to TreeNode). -Sthreads 1 serialises resolution; -P prepares without
    # running, warming .cpcache/.m2 deterministically.
    # Retries exist because Maven Central rate-limits GitHub runners: a cold
    # resolution intermittently returns 429 (or 403) mid-download and fails the
    # whole job before a single test runs. The failure then names an innocent
    # library, so it reads as "that lib's tests are broken" (BOU-250). Backoff is
    # exponential; only the transient HTTP statuses are worth retrying, but
    # tools.deps exits 1 for every error, so we retry on any failure and let the
    # last attempt surface the real message.
    - name: Prefetch deps (serial — avoids Maven concurrent-resolution crash)
      if: inputs.skip-on-hit != 'true' || steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -o pipefail

        # One retry policy for both loops below, so a directory warm is as
        # protected as an alias warm. It lives in a script so the clearing of
        # Maven's cached failures can be run against a fake ~/.m2 (BOU-440,
        # BOU-548).
        resolve_with_retry() {
          "${{ github.action_path }}/../../../scripts/ci-resolve-deps.sh" "$@"
        }

        for alias in ${{ inputs.aliases }}; do
          # "-" means the base deps: `clojure -P` with no alias at all.
          [ "$alias" = "-" ] && alias=""
          # "." is this step's working-directory; the message names it properly.
          resolve_with_retry "." "$alias" "${{ inputs.working-directory }}" || exit 1
        done

        # Each library's own deps.edn. Skipped when the input is empty, which is
        # every job but warm-deps.
        for glob in ${{ inputs.also-warm }}; do
          for dir in $glob; do
            [ -f "$dir/deps.edn" ] || continue
            echo "Warming $dir"
            resolve_with_retry "$dir" "" || exit 1
          done
        done
