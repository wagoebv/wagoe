name: Approval gate

# The required `approval-gate` check (BOU-1117): docs and tests merge on green
# CI alone; anything else needs the `approved` label (scripts/approval-gate.sh).
#
# pull_request_target, so the gate is main's version, never the pull request's:
# a PR could otherwise edit the gate to pass itself. It checks out only main's
# script and reads the PR through the API; no PR code runs here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # Each PR in a group passed the gate already; the queue needs the check too.
  merge_group:

permissions:
  contents: read
  pull-requests: read
  # Removes `approved` after a new push.
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approval-gate:
    name: approval-gate
    runs-on: ubuntu-latest
    steps:
      - name: Approved in the pull request
        if: github.event_name == 'merge_group'
        run: echo "Each pull request in this group passed approval-gate."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request_target'
        with:
          persist-credentials: false
          sparse-checkout: scripts/approval-gate.sh
          sparse-checkout-cone-mode: false

      - name: Docs and tests only, or labelled approved
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event.action }}
        run: ./scripts/approval-gate.sh
