name: Security

# `bb check:vulns`, weekly and on PRs that touch a deps.edn (BOU-451). Not part
# of "All Tests Passed": an advisory published today should not block an
# unrelated merge.

on:
  schedule:
    # Mondays, 07:00 UTC, after the dependency canary.
    - cron: '0 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/deps.edn'
      - '.wagoe/check-vulns.edn'
      - 'libs/tools/src/wagoe/tools/check_vulns.clj'
      - 'libs/tools/src/wagoe/tools/deps.clj'
      - 'bb.edn'
      - '.github/workflows/security.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilities:
    name: Known vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # The shared setup: pinned JDK and CLI, the warm CI cache, and the
      # retrying prefetch; the scan resolves every deps.edn and alias.
      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: "-"
          also-warm: libs/*

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Scan every deps.edn
        shell: bash
        env:
          # The run's own read-only token, not a secret: any branch can start this.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # `|| status=$?`: the step runs with -e, and the report has to be
          # written whether or not the scan found something.
          status=0
          bb check:vulns > report.txt 2>&1 || status=$?
          cat report.txt
          {
            echo "## Known vulnerabilities"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
