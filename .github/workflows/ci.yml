  # =============================================================================
  # Uberjar build — the deployable artifact
  #
  # Nothing in CI built a jar, so `clojure -T:build uber` was broken on macOS
  # (grpc-netty-shaded ships META-INF/license/ as a DIRECTORY while ~38 other
  # jars ship META-INF/LICENSE as a FILE; identical paths on a case-insensitive
  # filesystem) and the Docker builder produced `wagoe-1.2.null-standalone.jar`
  # because .git is dockerignored. Neither was detectable from a green CI run.
  # This job builds the artifact and asserts it is named and runnable.
  # =============================================================================
  build-uberjar:
    name: Build Uberjar
    runs-on: ubuntu-latest
    needs: warm-deps

    steps:
      - uses: actions/checkout@v6

      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:test

      - name: Build uberjar
        run: clojure -T:build uber

      # Ask build.clj for the version and path rather than re-deriving them in
      # shell — a second parser here could drift from the one in suite-version,
      # which is the class of bug this whole PR is about (BOU-250).
      - name: Assert the artifact is versioned and runnable
        run: |
          set -euo pipefail
          version=$(clojure -T:build print-version)
          jar=$(clojure -T:build print-uber-file)
          echo "expecting $jar (version $version)"

          case "$version" in
            *null*|"") echo "::error::version did not resolve: '$version'"; exit 1 ;;
          esac

          test -f "$jar" || { echo "::error::missing $jar"; ls -1 target/*.jar || true; exit 1; }

          # Read the manifest into a variable first: `unzip -p ... | grep -q`
          # lets grep exit on the first match, and under `pipefail` the SIGPIPE
          # on the writer can fail the step for the wrong reason.
          manifest=$(unzip -p "$jar" META-INF/MANIFEST.MF)
          grep -q 'Main-Class: wagoe.main' <<<"$manifest" \
            || { echo "::error::Main-Class is not wagoe.main"; exit 1; }

          # A real assertion, not `|| true`: --help is a supported mode that
          # exits 0 and prints usage, so requiring the banner proves the jar
          # loads its classes and reaches main.
          java -jar "$jar" --help | grep -q 'Usage:' \
            || { echo "::error::jar did not print usage via --help"; exit 1; }

          echo "ok: $jar"

      # The artifact building and booting does not mean it SERVES. Until BOU-251
      # nothing in CI ever requested a URL from the built jar, which is how a
      # shadowed logback config (silencing all logs) and a port allocator that
      # ignored HTTP_PORT both survived: the server came up on the wrong port,
      # said nothing about it, and every gate stayed green.
      - name: Smoke test — the jar actually serves HTTP
        env:
          WAG_ENV: test
          HTTP_PORT: "3195"
          JWT_SECRET: ci-test-secret-minimum-32-characters
        run: |
          set -euo pipefail
          jar=$(clojure -T:build print-uber-file)
          java -jar "$jar" server > /tmp/server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            # NB: curl already prints 000 on connection failure, so `|| echo 000`
            # would append a SECOND 000 and yield "000000" — which compares
            # unequal to "000" and breaks the loop on the first pass with a
            # meaningless value. Use `|| true` purely to survive `set -e`.
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${HTTP_PORT}/web/login" || true)
            [ "$code" != "000" ] && [ -n "$code" ] && break
            # Fail fast if the process died rather than waiting out the loop.
            kill -0 $pid 2>/dev/null || { echo "::error::server exited during startup"; cat /tmp/server.log; exit 1; }
            sleep 3
          done

          echo "GET /web/login -> $code"
          case "$code" in
            2*|3*) ;;
            *) echo "::error::jar did not serve on the requested port ${HTTP_PORT} (got $code)"
               cat /tmp/server.log
               exit 1 ;;
          esac

          # The port is asserted explicitly: binding SOMEWHERE is not the
          # contract, binding where it was told to is.
          grep -q "started on requested port" /tmp/server.log \
            || { echo "::error::server did not bind the requested port"; cat /tmp/server.log; exit 1; }

          echo "ok: served $code on ${HTTP_PORT}"

      - name: Upload the uberjar
        uses: actions/upload-artifact@v4
        with:
          name: wagoe-uberjar
          path: target/wagoe-*-standalone.jar
          retention-days: 7
          if-no-files-found: error

  # =============================================================================
  # Summary job
  # =============================================================================
  # =============================================================================
  # First-run smoke — the documented newcomer path, in a bare container
  # =============================================================================
  first-run-smoke:
    name: First-Run Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Deliberately no Clojure/Java setup: the test runs inside a bare
      # ubuntu:24.04 container and installs everything via scripts/install.sh.
      # Running it on the runner would hide exactly the defects it exists to
      # catch — the runner already has java, git, unzip and sudo, so install.sh
      # never takes the branch where BOU-226's three blockers lived.
      # Explicit, though it is the default: this job gates the branch and must
      # test the branch. The released target lives in first-run-matrix.yml,
      # where a red cell means "the current release is stale" — which is not a
      # reason to block a pull request (BOU-402).
      - name: Run first-run smoke test
        env:
          SMOKE_TARGET: worktree
          # install.sh's release lookup honours GITHUB_TOKEN (BOU-410) —
          # 5000 requests/hour instead of 60 per shared runner IP, which is
          # the throttle that has been failing this job at step [2/9].
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/first-run-smoke.sh

  test-summary:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [lint, branch-protection, first-run-smoke, build-ui-assets, docs-lint, agents-links, command-smoke, config-doctor, i18n-scan, check-fcis, check-placeholder-tests, check-test-meta, check-test-tags, check-deps, check-ports, check-hygiene, check-changelog, check-doc-counts, check-jdk, check-roadmap, check-versions, check-isolation, check-error-shape, check-isolation-matrix, check-poms, check-agents, check-no-boundary, build-uberjar, test-tools, example-smoke, test-i18n, test-config, test-app, test-core, test-observability, test-platform, test-user, test-admin, test-ui-style, test-storage, test-cache, test-events, test-jobs, test-tenant, test-audience, test-devtools, test-email, test-realtime, test-workflow, test-search, test-scaffolder, test-external, test-payments, test-push, test-calendar, test-reports, test-geo, test-ai, test-mcp, test-wagoe-cli, test-shared-ui, e2e]

    steps:
      - name: Summary
        run: |
          echo "✅ All library tests passed!"
          echo "  - the app itself (:unit suite — wiring + service-catalogue gates)"
          echo "Libraries tested:"
          echo "  - wagoe/core"
          echo "  - wagoe/observability"
          echo "  - wagoe/platform"
          echo "  - wagoe/user"
          echo "  - wagoe/admin"
          echo "  - wagoe/ui-style"
          echo "  - wagoe/shared-ui"
          echo "  - wagoe/storage"
          echo "  - wagoe/cache"
          echo "  - wagoe/events"
          echo "  - wagoe/jobs"
          echo "  - wagoe/tenant"
          echo "  - wagoe/email"
          echo "  - wagoe/realtime"
          echo "  - wagoe/workflow"
          echo "  - wagoe/search"
          echo "  - wagoe/scaffolder"
          echo "  - wagoe/external"
          echo "  - wagoe/payments"
          echo "  - wagoe/push"
          echo "  - wagoe/calendar"
          echo "  - wagoe/reports"
          echo "  - wagoe/geo"
          echo "  - wagoe/ai"
          echo "  - wagoe/i18n"
          echo "  - wagoe/wagoe-mcp"
          echo "  - wagoe/wagoe-cli"
          echo "Gates passed:"
          echo "  - config-doctor (no config errors)"
          echo "  - i18n:scan (no unexternalised strings)"
          echo "  - check:fcis (no FC/IS boundary violations)"
          echo "  - check:placeholder-tests (no placeholder assertions)"
          echo "  - check:test-meta (deftest metadata placed correctly)"
          echo "  - check:test-tags (one pyramid tag per deftest)"
          echo "  - check:deps (no dependency direction violations)"
          echo "  - check:ports (no hexagonal boundary violations)"
          echo "  - check:hygiene (no tracked backup/cruft files)"
          echo "  - check:doc-counts (documented library counts match all-libs)"
          echo "  - check:roadmap (one roadmap, planning nothing already shipped)"
          echo "  - check:poms (published POMs carry inter-Wagoe deps)"
          echo "  - check:agents (AGENTS.md in sync with the generator)"
          echo "  - check:no-boundary (no residual boundary tokens)"
          echo "  - build-uberjar (deployable artifact builds and is versioned)"
          echo "  - test-tools (libs/tools + AGENTS.md generator tests)"
          echo "  - example-smoke (examples/todo + examples/shop run)"
