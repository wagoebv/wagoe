      - name: Check deftest pyramid tags
        run: bb check:test-tags

  # =============================================================================
  # Dependency direction linting (Babashka — fast, no JVM)
  # =============================================================================
  check-deps:
    name: Dependency Direction Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
