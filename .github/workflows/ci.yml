name: Wagoe CI

# A `push:`-only trigger covered same-repo branches and nothing else: a pull
# request from a fork ran zero jobs, so "All Tests Passed" — the one context
# branch protection requires — sat permanently pending rather than failing.
# Pending is not red, so nothing announced that the code had never been tested
# (BOU-315; same shape as BOU-277, where 13 required contexts never reported).
#
# `push:` is scoped to main because pull_request now covers everything else.
# Left unscoped, a same-repo PR would run all 58 jobs twice — once for the push,
# once for the PR — under two concurrency groups that cannot cancel each other.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# `github.event.pull_request.number` was dead under a push-only trigger and
# always fell through to github.ref. With pull_request wired up it finally does
# what it says: successive pushes to one PR cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Lint all code
  # =============================================================================
  # =============================================================================
  # Warm the shared dependency cache ONCE, before anything fans out.
  #
  # Without this, lint/docs-lint/command-smoke all start on a cold cache and race
  # to save the same key. lint has the smallest dep set (-M:clj-kondo) so it
  # usually wins — poisoning the key with a near-empty cache. The ~26 test jobs
  # then each restore that stub and pull the whole :test tree from Maven Central
  # in parallel, which reliably trips Central's rate limiter (429/403) and fails
  # a job before any test runs. Prefetching the union of aliases here means every
  # later job restores a fully populated ~/.m2. (BOU-250, mechanism 4.)
  #
  # Every other JVM job needs this one and nothing else. Jobs used to wait on
  # lint and on each other in library order, but nothing passes between them:
  # each builds its own classpath. The chain made the run as slow as six JVM
  # jobs back to back (BOU-527). test-summary still needs every job.
  # =============================================================================
  warm-deps:
    name: Warm Dependency Cache
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:clj-kondo -M:docs-lint -M:migrate -M:test
          # Each library's own deps.edn too. A library pins its own versions, so
          # the root closures miss artifacts the 30 isolation cells need — and
          # every cell then fetched them from Central concurrently with nothing
          # cached behind it (BOU-441).
          also-warm: libs/*
          skip-on-hit: "true"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: warm-deps

    steps:
      - uses: actions/checkout@v6

      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:clj-kondo

      - name: Clear clj-kondo cache
        run: rm -rf .clj-kondo/.cache/* 2>/dev/null || true

      - name: Lint with clj-kondo
        run: |
          # Glob instead of a hand-maintained list: the explicit list had
          # drifted — root src/, dev/, scripts/ and libs audience|devtools|
          # wagoe-cli were never linted, which is how a dev/ arity error went
          # unnoticed. Matches the documented command in AGENTS.md, so a newly
          # added lib is covered automatically.
          clojure -M:clj-kondo --lint \
            src test dev scripts \
            libs/*/src libs/*/test \
            examples/todo/src

  # =============================================================================
  # Build shared UI assets
  # =============================================================================
  build-ui-assets:
    name: Build UI Assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build admin CSS bundle
        run: npm run build:css:admin

      - name: Verify generated UI assets
        run: |
          test -f libs/ui-style/resources/public/css/daisy-admin.css
          test -f libs/ui-style/resources/public/js/theme.js
          test -f libs/ui-style/resources/public/js/htmx.min.js

  # =============================================================================
  # Documentation drift check (failing gate)
  # =============================================================================
  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    needs: warm-deps

    steps:
      - uses: actions/checkout@v6

      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:docs-lint

      - name: Run docs-lint
        run: clojure -M:docs-lint

      - name: Upload docs-lint report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-lint-report
          path: build/docs-lint/
          retention-days: 14

  # =============================================================================
  # AGENTS link integrity check
  # =============================================================================
  agents-links:
    name: AGENTS Links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check AGENTS links
        run: bb check-links

  # =============================================================================
  # Fast command smoke checks (aliases + key docs/dev commands)
  # =============================================================================
  command-smoke:
    name: Command Smoke Checks
    runs-on: ubuntu-latest
    needs: warm-deps

    steps:
      - uses: actions/checkout@v6

      # Prefetch every alias set smoke-check invokes (:migrate and :test) so each
      # reuses a warm .cpcache and performs no concurrent resolution.
      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:migrate -M:test

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Run command smoke check
        run: bb smoke-check

  # =============================================================================
  # Config Doctor — validate config files for common mistakes
  # =============================================================================
  config-doctor:
    name: Config Doctor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Validate dev config
        run: bb doctor --env dev --ci

      - name: Validate test config
        run: bb doctor --env test --ci

  # =============================================================================
  # FC/IS boundary enforcement (Babashka — fast, no JVM)
  # =============================================================================
  check-fcis:
    name: FC/IS Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check FC/IS boundaries
        run: bb check:fcis

  # =============================================================================
  # Placeholder test detection (Babashka — fast, no JVM)
  # =============================================================================
  check-placeholder-tests:
    name: Placeholder Test Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check for placeholder tests
        run: bb check:placeholder-tests

  # =============================================================================
  # Deftest metadata placement (Babashka — fast, no JVM)
  # =============================================================================
  check-test-meta:
    name: Deftest Metadata Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check deftest metadata placement
        run: bb check:test-meta

  # =============================================================================
  # Deftest pyramid tags (Babashka — fast, no JVM)
  # =============================================================================
  check-test-tags:
    name: Deftest Pyramid Tag Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check deftest pyramid tags
        run: bb check:test-tags

  # =============================================================================
  # Dependency direction linting (Babashka — fast, no JVM)
  # =============================================================================
  check-deps:
    name: Dependency Direction Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check dependency direction
        run: bb check:deps

  # =============================================================================
  # Ports / hexagonal boundary enforcement (Babashka — fast, no JVM)
  # =============================================================================
  check-ports:
    name: Ports Boundary Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check ports / hexagonal boundaries
        run: bb check:ports

  # =============================================================================
  # Repo hygiene — no tracked backup/cruft files (Babashka — fast, no JVM)
  # =============================================================================
  check-hygiene:
    name: Repo Hygiene Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check for tracked backup/cruft files
        run: bb check:hygiene

  # =============================================================================
  # A branch changing shipped src/ must describe it in CHANGELOG.md
  # =============================================================================
  check-changelog:
    name: Changelog Check
    runs-on: ubuntu-latest

    steps:
      # Full history: the gate compares against the merge base with the target
      # branch, and a shallow clone has neither the base nor a common ancestor.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check the changelog covers this branch
        env:
          CHANGELOG_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: bb check:changelog

  # =============================================================================
  # Documented library counts vs deploy/all-libs (Babashka — fast, no JVM)
  # =============================================================================
  check-doc-counts:
    name: Documented Library Count Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check documented library counts and publishing claims
        run: bb check:doc-counts

  check-jdk:
    name: JDK Baseline Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Every Dockerfile, workflow and installer names the same JDK
        run: bb check:jdk

  check-roadmap:
    name: Roadmap Agreement Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: One roadmap, and it plans nothing that already shipped
        run: bb check:roadmap

  # =============================================================================
  # "30 independently publishable libraries" — the static half
  #
  # A library may not load a namespace it neither owns nor declares. This is the
  # half `check-isolation-matrix` below cannot see: 30 of 31 libraries compile
  # clean against their own deps.edn, realtime included, because its require sits
  # in a try/catch that swallows the failure. The namespace loads; the adapter
  # throws on first use, from Clojars, in a user's application (BOU-304).
  # =============================================================================
  check-error-shape:
    name: Errors Carry Their Shape
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      # ADR-022 required a :type on every thrown ex-info in April 2026 and
      # nothing checked it: 59 shell throws had none by August. ADR-036 added
      # the return shapes. The allowlist ships full and empties as BOU-323
      # walks the migration; an entry that stops exempting anything fails here.
      - name: Check errors carry the shape ADR-022 and ADR-036 decided
        run: bb check:error-shape

  check-isolation:
    name: Libraries Declare What They Load
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check no library loads an undeclared namespace
        run: bb check:isolation

      # libs/tools is the one library the isolated-build matrix cannot cover:
      # its runtime is Babashka, so `clojure -M` cannot load it. Babashka can,
      # and against its own src/ alone this is the same property every other
      # library gets from a matrix cell. Without it, tools' isolation rested
      # entirely on the static gate above.
      - name: Load libs/tools against only its own source (Babashka runtime)
        run: |
          set -euo pipefail
          form="$(bb -e "(require '[wagoe.tools.check-isolation :as ci]) (print (ci/require-form \"tools\"))")"
          cd libs/tools
          bb --classpath src -e "$form"

  # =============================================================================
  # "30 independently publishable libraries" — the compile half
  #
  # Each library built against *only* its own deps.edn, not the monorepo
  # classpath. Catches an undeclared static require, which is the failure the
  # claim is usually assumed to be about. Compile-only rather than each library's
  # test suite: it is a fraction of the runtime, and the tests would not add
  # coverage of the smuggling — check-isolation above is what catches that.
  #
  # Two of the 31 libraries are not cells. `libs/tools` because its runtime is
  # Babashka, not the JVM: babashka.process and babashka.fs are built into bb and
  # are not Maven dependencies, so `clojure -M` cannot load it by design —
  # `bb test:tools` is what exercises it. `libs/e2e` because it has no src/ at
  # all, only tests.
  #
  # The list below is checked against the tree by `matrix-covers-every-library`
  # in check_isolation_test.clj: a library added under libs/ without a cell here
  # fails that test rather than silently going unbuilt.
  # =============================================================================
  check-isolation-matrix:
    name: Isolated Build (${{ matrix.lib }})
    runs-on: ubuntu-latest
    needs: warm-deps

    strategy:
      fail-fast: false
      matrix:
        lib: [admin, ai, audience, cache, calendar, config, core, devtools, email, events,
              external, geo, i18n, jobs, observability, payments, platform, push,
              realtime, reports, scaffolder, search, shared-ui, storage, tenant,
              ui-style, user, wagoe-cli, wagoe-mcp, workflow]

    steps:
      - uses: actions/checkout@v6

      # The composite action rather than a hand-rolled setup-clojure + cache.
      # It carries the v2 cache key — the un-versioned one it replaced was
      # poisoned by whichever job with the smallest dependency tree won the save
      # race, and 29 cells racing to write it would re-mint that stub — and it
      # prefetches serially, which is what avoids the Maven concurrent-resolution
      # crash and retries Maven Central's 429s. Without it, a rate-limited cell
      # fails under an innocent library's name (#211, #329, BOU-250).
      - name: Setup Clojure + restore deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:test

      # And again for the library's own deps.edn, which the step below resolves
      # from its directory. Prefetching only the root left that second
      # resolution unretried, and a Maven 403 there failed the cell under the
      # name of whichever library it was building (BOU-417).
      - name: Warm this library's own deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: "-"
          working-directory: libs/${{ matrix.lib }}

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      # Requires every namespace the library ships, from the library's own
      # directory, so the classpath is its deps.edn and nothing else.
      #
      # The namespace list is built by wagoe.tools.check-isolation rather than by
      # find|sed here: the shell version used `s|\.cljc\?$||`, and `\?` is GNU
      # basic-regex, so BSD sed left the extension on and emitted
      # `(require 'wagoe.core.foo.clj)`. Green on this runner, broken for anyone
      # reproducing the job on a Mac. It is unit-tested there.
      - name: Load every namespace against only this library's deps.edn
        run: |
          set -euo pipefail

          form="$(bb -e "(require '[wagoe.tools.check-isolation :as ci]) (print (ci/require-form \"${{ matrix.lib }}\"))")"

          if [ -z "$form" ]; then
            echo "No namespaces under src/ — nothing to isolate."
            exit 0
          fi

          echo "Loading in isolation:"
          bb -e "(require '[wagoe.tools.check-isolation :as ci]) (run! println (ci/namespaces-of \"${{ matrix.lib }}\"))" | sed 's/^/  /'

          cd "libs/${{ matrix.lib }}"
          clojure -M -e "$form"

  # =============================================================================
  # Suite version consistency (Babashka — fast, no JVM)
  # =============================================================================
  check-versions:
    name: Suite Version Consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check every hard-coded suite version agrees
        run: bb check:versions

  # =============================================================================
  # POM dependency completeness (Babashka — fast, no JVM)
  # =============================================================================
  check-poms:
    name: POM Dependency Completeness Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check published POMs carry inter-Wagoe deps
        run: bb check:poms

  # =============================================================================
  # Branch protection coverage (Babashka — fast, no JVM)
  # =============================================================================
  # BOU-277: protection required 13 contexts that were the job *keys* from this
  # file, while GitHub reports each job's `name:`. They could never be
  # satisfied, and while an admin override absorbed them, could never fail.
  #
  # It now requires exactly one context — `All Tests Passed` — and this job
  # checks that the summary transitively depends on everything that can run. No
  # API and no token: the earlier version read branch protection directly, which
  # meant an admin-scoped credential living in the repository.
  branch-protection:
    name: Branch Protection Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: The one required context must cover every job
        run: bb check:branch-protection

  # =============================================================================
  # AGENTS.md generator drift (Babashka — fast, no JVM)
  # =============================================================================
  check-agents:
    name: AGENTS.md Drift Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check AGENTS files are in sync with the generator
        run: bb check:agents

  # =============================================================================
  # Rename gate — no residual boundary tokens (Babashka — fast, no JVM)
  # =============================================================================
  check-no-boundary:
    name: Rename Gate (no residual boundary tokens)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      # git grep needs the full history-free worktree only, but the gate reads
      # tracked files via `git ls-files`/`git grep`, so a plain checkout is enough.
      - name: Check for residual boundary namespaces, keys, coords, env and URLs
        run: bb check:no-boundary

  # =============================================================================
  # In-repo runnable examples must actually run (examples/todo, examples/shop)
  #
  # examples/shop is generated output, committed so it can be read and so this
  # job runs it. Both resolve com.wagoe through :local/root, so a green run
  # means this commit works — not that the last release did (BOU-300).
  # =============================================================================
  example-smoke:
    name: Example Smoke (examples/)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # This job boots the generated app, so it answers for the JDK baseline
      # too; it does not use the clojure-deps action, where the pin lives.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.6.1673
          bb: latest

      - name: Run both examples
        run: ./scripts/example-smoke.sh

      # Separate from running it: an example that runs can still have stopped
      # being what `wagoe new` produces, and then it documents a project shape
      # nobody gets. That is what happened to the external examples repo.
      - name: examples/shop is still what the generators produce
        run: bb example:regen --check

  # =============================================================================
  # Test individual libraries (run from root to ensure all dependencies available)
  # =============================================================================
  test-config:
    name: Test wagoe/config
    runs-on: ubuntu-latest
    needs: warm-deps

    steps:
      - uses: actions/checkout@v6

      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:test
          working-directory: libs/config

      - name: Run config tests
        working-directory: libs/config
        run: clojure -M:test

  test-app:
    name: Test app (:unit suite)
    runs-on: ubuntu-latest
    needs: warm-deps

    services:
      # `:unit` spans every library's tests, so it inherits their services. The
      # cache, events and jobs sweeps compare a Redis adapter against the others
      # and fail loudly rather than silently comparing two backends where three
      # were promised — which is how this job first ran red.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # The audience adapter sweep compares H2, SQLite, PostgreSQL and MySQL.
      # PostgreSQL is embedded and SQLite is a file; MySQL needs a server, and
      # without one the sweep fails saying so rather than reporting three
      # adapters as the whole set.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: probe
          MYSQL_DATABASE: audience
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pprobe --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    # The root `test/` tree: the BOU-326 wiring gate, the BOU-91 service-catalogue
    # gate, and the application-level tests. No job ran the `:unit` suite, so
    # those two gates were never executed in CI — a PR merged green while one of
    # them was failing (BOU-422).
    #
    # `:unit` also lists every library's test path, so this repeats what the
    # per-library jobs cover. Deliberate: narrowing the suite changes what
    # `bb test:all` means locally. It is now the longest job, so it sets the
    # run's wall-clock (BOU-527).
    steps:
      - uses: actions/checkout@v6

      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:test:test/all

      - name: Run app + unit suite
        env:
          JWT_SECRET: "ci-test-secret-minimum-32-characters"
          WAG_ENV: test
        run: clojure -M:test:test/all :unit

  test-core:
    name: Test wagoe/core
    runs-on: ubuntu-latest
    needs: warm-deps

    steps:
      - uses: actions/checkout@v6

      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:test

      - name: Run tests
        env:
          JWT_SECRET: "ci-test-secret-minimum-32-characters"
        run: clojure -M:test :core

  test-observability:
    name: Test wagoe/observability
    runs-on: ubuntu-latest
    needs: warm-deps

    steps:
      - uses: actions/checkout@v6

      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:test:test/otel

      - name: Run tests
        env:
          JWT_SECRET: "ci-test-secret-minimum-32-characters"
        run: clojure -M:test:test/otel :observability

  test-platform:
    name: Test wagoe/platform
    runs-on: ubuntu-latest
    needs: warm-deps

    steps:
      - uses: actions/checkout@v6

      - name: Setup Clojure + warm deps
