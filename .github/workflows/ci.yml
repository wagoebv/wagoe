    runs-on: ubuntu-latest
    needs: [lint, build-ui-assets]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1654
          bb: latest

      - name: Cache Maven deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-spel-0.7.11

      - name: Warm deps
        run: clojure -P -M:test:e2e

      - name: Install Playwright browsers
        run: clojure -M:e2e -e "(.exit (com.microsoft.playwright.CLI/main (into-array String [\"install\" \"chromium\"])))"

      - name: Run e2e suite
        continue-on-error: true
        run: bb e2e
        env:
          WAG_ENV: test
          CI: "true"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: |
            target/spel/
            target/test-output/
          retention-days: 7

  # =============================================================================
  # Babashka-only test surfaces (libs/tools + the AGENTS.md generator)
  #
  # Neither ran in CI. libs/tools is pure Babashka and libs/tools/test is on no
  # kaocha suite, so its 107 tests — which cover the quality-gate checkers
  # themselves, including the all-checks/CI lockstep test — were verified only
  # when someone ran `bb test:tools` by hand. Same for the generator tests.
  # `bb test:all` runs these locally; these jobs make CI agree (BOU-246).
  # =============================================================================
  test-tools:
    name: Test wagoe/tools
    runs-on: ubuntu-latest
    needs: warm-deps

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Run wagoe-tools unit tests
        run: bb test:tools

      - name: Run AGENTS.md generator tests
        run: bb test:agents

  # =============================================================================
  # Uberjar build — the deployable artifact
  #
  # Nothing in CI built a jar, so `clojure -T:build uber` was broken on macOS
  # (grpc-netty-shaded ships META-INF/license/ as a DIRECTORY while ~38 other
  # jars ship META-INF/LICENSE as a FILE; identical paths on a case-insensitive
  # filesystem) and the Docker builder produced `wagoe-1.2.null-standalone.jar`
  # because .git is dockerignored. Neither was detectable from a green CI run.
  # This job builds the artifact and asserts it is named and runnable.
  # =============================================================================
  build-uberjar:
    name: Build Uberjar
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v6

      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:test

      - name: Build uberjar
        run: clojure -T:build uber

      # Ask build.clj for the version and path rather than re-deriving them in
      # shell — a second parser here could drift from the one in suite-version,
      # which is the class of bug this whole PR is about (BOU-250).
      - name: Assert the artifact is versioned and runnable
        run: |
          set -euo pipefail
          version=$(clojure -T:build print-version)
          jar=$(clojure -T:build print-uber-file)
          echo "expecting $jar (version $version)"

          case "$version" in
            *null*|"") echo "::error::version did not resolve: '$version'"; exit 1 ;;
          esac

          test -f "$jar" || { echo "::error::missing $jar"; ls -1 target/*.jar || true; exit 1; }

          # Read the manifest into a variable first: `unzip -p ... | grep -q`
          # lets grep exit on the first match, and under `pipefail` the SIGPIPE
          # on the writer can fail the step for the wrong reason.
          manifest=$(unzip -p "$jar" META-INF/MANIFEST.MF)
          grep -q 'Main-Class: wagoe.main' <<<"$manifest" \
            || { echo "::error::Main-Class is not wagoe.main"; exit 1; }

          # A real assertion, not `|| true`: --help is a supported mode that
          # exits 0 and prints usage, so requiring the banner proves the jar
          # loads its classes and reaches main.
          java -jar "$jar" --help | grep -q 'Usage:' \
            || { echo "::error::jar did not print usage via --help"; exit 1; }

          echo "ok: $jar"

      - name: Upload the uberjar
        uses: actions/upload-artifact@v4
        with:
          name: wagoe-uberjar
          path: target/wagoe-*-standalone.jar
          retention-days: 7
          if-no-files-found: error

  # =============================================================================
  # Summary job
  # =============================================================================
  test-summary:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [build-ui-assets, docs-lint, agents-links, command-smoke, config-doctor, i18n-scan, check-fcis, check-placeholder-tests, check-test-meta, check-test-tags, check-deps, check-ports, check-hygiene, check-poms, check-agents, check-no-boundary, build-uberjar, test-tools, example-smoke, test-i18n, test-core, test-observability, test-platform, test-user, test-admin, test-ui-style, test-storage, test-cache, test-jobs, test-tenant, test-email, test-realtime, test-workflow, test-search, test-scaffolder, test-external, test-payments, test-push, test-calendar, test-reports, test-geo, test-ai, test-mcp, test-wagoe-cli, test-shared-ui]

    steps:
      - name: Summary
        run: |
          echo "✅ All library tests passed!"
          echo "Libraries tested:"
          echo "  - wagoe/core"
          echo "  - wagoe/observability"
          echo "  - wagoe/platform"
          echo "  - wagoe/user"
          echo "  - wagoe/admin"
          echo "  - wagoe/ui-style"
          echo "  - wagoe/shared-ui"
          echo "  - wagoe/storage"
          echo "  - wagoe/cache"
          echo "  - wagoe/jobs"
          echo "  - wagoe/tenant"
          echo "  - wagoe/email"
          echo "  - wagoe/realtime"
          echo "  - wagoe/workflow"
          echo "  - wagoe/search"
          echo "  - wagoe/scaffolder"
          echo "  - wagoe/external"
          echo "  - wagoe/payments"
          echo "  - wagoe/push"
          echo "  - wagoe/calendar"
          echo "  - wagoe/reports"
          echo "  - wagoe/geo"
          echo "  - wagoe/ai"
          echo "  - wagoe/i18n"
          echo "  - wagoe/wagoe-mcp"
          echo "  - wagoe/wagoe-cli"
          echo "Gates passed:"
          echo "  - config-doctor (no config errors)"
          echo "  - i18n:scan (no unexternalised strings)"
          echo "  - check:fcis (no FC/IS boundary violations)"
          echo "  - check:placeholder-tests (no placeholder assertions)"
          echo "  - check:test-meta (deftest metadata placed correctly)"
          echo "  - check:test-tags (one pyramid tag per deftest)"
