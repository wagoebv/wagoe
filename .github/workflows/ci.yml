  # =============================================================================
  # End-to-end Clojure/spel tests
  # =============================================================================
  e2e:
    name: E2E (spel)
    runs-on: ubuntu-latest
    needs: [warm-deps, build-ui-assets]

    steps:
      - uses: actions/checkout@v6

      # The composite action rather than a hand-rolled setup + cache. This job
      # had its own of both: an unretried `clojure -P`, and a cache key on the
      # un-versioned prefix the action abandoned — the one a job with a small
      # dependency tree can poison, which is why the action's key carries `v2`
      # (BOU-417).
      - name: Setup Clojure + warm deps
        uses: ./.github/actions/clojure-deps
        with:
          aliases: -M:test:e2e

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-spel-0.7.11

      # A download from Microsoft's CDN, and the only external fetch here the
      # dependency cache does not cover. Retried for the same reason Maven is:
      # a transient 5xx failed the whole suite before a test ran.
      - name: Install Playwright browsers
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if clojure -M:e2e -e "(.exit (com.microsoft.playwright.CLI/main (into-array String [\"install\" \"chromium\"])))"; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Playwright browser download failed after 4 attempts"
              exit 1
            fi
            delay=$((attempt * attempt * 10))
            echo "::warning::browser download failed (attempt $attempt/4) — retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Run e2e suite
        run: bb e2e
        env:
          WAG_ENV: test
          CI: "true"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: |
            target/spel/
            target/test-output/
          retention-days: 7

