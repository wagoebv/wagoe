  # =============================================================================
  # i18n scan gate — fails if any UI file still has unexternalised string literals
  # =============================================================================
  i18n-scan:
    name: i18n Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-

      - name: Scan for unexternalised strings
        run: bb i18n:scan

