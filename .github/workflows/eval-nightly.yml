name: Scaffold AI eval (nightly)

# How good `bb scaffold ai` output is against real providers, one number per
# night per provider (BOU-909). Not part of ci.yml and not a required check:
# a model having a bad night must not block a merge. Results go to the
# eval-results branch; eval/scaffold/README.md says how to read them.

on:
  schedule:
    # 04:41 UTC, after the first-run matrix, off the hour.
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated prompt ids to run (empty: all)'
        required: false
        default: ''

concurrency:
  group: eval-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    name: Eval — ${{ matrix.provider }}
    runs-on: ubuntu-latest
    # Ollama runs a 7B model on CPU: slow, and that is fine.
    timeout-minutes: 300
    # workflow_dispatch can run a branch's copy of this file. The `eval`
    # environment allows main only and holds OPENAI_API_KEY, so branch code
    # never sees the key.
    environment: eval
    strategy:
      fail-fast: false
      matrix:
        provider: [ollama, openai]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.6.1673
          bb: latest

      # Restore only. ci.yml's warm-deps is the one job that saves this key;
      # a partial save from here would poison it for every CI job.
      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-v6-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-v6-

      # The generated project's extra deps and cljfmt, under a key of our own
      # so the ci.yml key above is never written from here.
      - name: Restore eval dependency cache
        id: eval-deps
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: eval-deps-${{ runner.os }}-${{ matrix.provider }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: eval-deps-${{ runner.os }}-${{ matrix.provider }}-

      # Serial Maven resolution, as scripts/first-run-smoke.sh does (BOU-643).
      - name: Serial clojure wrapper
        run: |
          real="$(command -v clojure)"
          mkdir -p "$HOME/.eval-bin"
          printf '#!/usr/bin/env bash\nexec %q -Sthreads 1 "$@"\n' "$real" > "$HOME/.eval-bin/clojure"
          chmod +x "$HOME/.eval-bin/clojure"
          echo "$HOME/.eval-bin" >> "$GITHUB_PATH"

      - name: Install clj-paren-repair
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/bbin" https://raw.githubusercontent.com/babashka/bbin/v0.2.5/bbin
          chmod +x "$HOME/.local/bin/bbin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          bbin install https://github.com/bhauman/clojure-mcp-light.git --tag v0.2.2 \
            --as clj-paren-repair --main-opts '["-m" "clojure-mcp-light.paren-repair"]'
          command -v clj-paren-repair

      - name: Cache Ollama model
        if: matrix.provider == 'ollama'
        uses: actions/cache@v5
        with:
          path: ~/.ollama-models
          key: ollama-qwen2.5-coder-7b-v1

      - name: Start Ollama
        if: matrix.provider == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a systemd service with its own model dir; run
          # our own so the cached directory is the one used.
          sudo systemctl stop ollama || true
          mkdir -p "$HOME/.ollama-models"
          OLLAMA_MODELS="$HOME/.ollama-models" nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fs http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen2.5-coder:7b
          ollama list

      - name: Run the eval
        env:
          OPENAI_API_KEY: ${{ matrix.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          ONLY: ${{ inputs.only }}
        run: |
          bb eval:scaffold --provider "${{ matrix.provider }}" --out eval-out ${ONLY:+--only "$ONLY"}

      - name: Save eval dependency cache
        if: always() && steps.eval-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: eval-deps-${{ runner.os }}-${{ matrix.provider }}-${{ hashFiles('**/deps.edn') }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-${{ matrix.provider }}
          path: eval-out/*.edn
          if-no-files-found: warn

  publish:
    name: Publish results
    runs-on: ubuntu-latest
    needs: eval
    # Only main's full runs are history. A branch or --only dispatch is a
    # try-out: a partial night would overwrite tonight's file and read as a drop.
    if: always() && github.ref == 'refs/heads/main' && !inputs.only
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - uses: actions/download-artifact@v5
        with:
          pattern: eval-*
          path: eval-out
          merge-multiple: true

      - name: Commit to eval-results
        run: |
          if git ls-remote --exit-code --heads origin eval-results >/dev/null; then
            git fetch --depth=1 origin eval-results
            git worktree add --detach results FETCH_HEAD
            git -C results switch -c eval-results
          else
            git worktree add --detach results
            git -C results switch --orphan eval-results
          fi
          mkdir -p results/scaffold
          cp eval-out/*.edn results/scaffold/ 2>/dev/null || { echo "No result files to publish"; exit 1; }
          cd results
          git add scaffold
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Scaffold eval $(date -u +%F) (${GITHUB_SHA::9})"
          git push origin eval-results

      - name: Report
        run: bb eval:report results/scaffold | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open an issue on regression
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for p in ollama openai; do
            # Only a provider that ran tonight: else an old drop is reported again.
            ls eval-out/*-"$p".edn >/dev/null 2>&1 || continue
            set +e
            bb eval:report results/scaffold --regression "$p" > "body-$p.md"
            rc=$?
            set -e
            [ "$rc" -eq 0 ] && continue
            [ "$rc" -eq 2 ] || { cat "body-$p.md"; exit "$rc"; }
            printf '\nRun: %s\n' "$RUN_URL" >> "body-$p.md"
            title="Scaffold AI eval regressed: $p"
            open=$(gh issue list --label eval-regression --state open --search "\"$title\" in:title" \
                     --json number --jq '.[0].number // empty')
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file "body-$p.md"
            else
              gh label create eval-regression --color d73a4a --force \
                --description "The nightly scaffold AI eval dropped"
              gh issue create --title "$title" --label eval-regression --body-file "body-$p.md"
            fi
          done
