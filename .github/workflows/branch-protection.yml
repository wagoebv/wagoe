name: Branch Protection

# Reconciles main's required status checks against the job names CI emits.
# See BOU-277: the required set held job *keys* from ci.yml while GitHub reports
# each job's `name:`, so 13 contexts could never be satisfied — and, while an
# admin override absorbed them, could never fail either.
#
# This lives outside ci.yml deliberately. Reading branch protection needs an
# admin-scoped token, and ci.yml runs `on: push`, which for a same-repository
# branch executes *that branch's* workflow with secrets available. Anyone able
# to push a branch could rewrite the step and exfiltrate the token. Every
# trigger below runs only code that is already on main, so branch contents never
# see the credential.
#
# The cost is timeliness: a job renamed in a PR is caught when it merges rather
# than before. The pre-merge half — that every gate job is wired into the
# summary — is covered by `every-gate-job-blocks-the-summary` in
# libs/tools/test, which needs no token and runs in `bb test:tools`.
#
# BRANCH_PROTECTION_TOKEN needs `administration: read` on this repository and
# nothing else. Without it the check skips rather than reporting a false pass.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'libs/tools/src/wagoe/tools/check_branch_protection.clj'
  schedule:
    # Daily, so a change made directly in the GitHub UI is caught too — that is
    # how the original drift arrived, and no push would have revealed it.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-protection:
    name: Branch Protection Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Required status checks must name jobs CI emits
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: bb check:branch-protection
