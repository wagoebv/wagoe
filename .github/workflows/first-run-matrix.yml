name: First-Run Matrix (nightly)

# The broad first-run coverage from BOU-232: several distros, plus the paths a
# newcomer takes by accident. Deliberately NOT part of the per-push CI.
#
# `First-Run Smoke` in ci.yml already gates every push on one image, one happy
# path, and is fast enough to belong there. This is the slow half — roughly four
# minutes per cell, most of it install.sh downloading a JVM — so it runs nightly
# and on demand instead of on every commit.
#
# workflow_dispatch is not an afterthought: it is how this doubles as the
# pre-release gate. Run it by hand before cutting a release rather than trusting
# that last night's run still describes today's tree.
#
# A failing scheduled run opens (or comments on) one issue labelled
# nightly-failure, and the next passing one closes it. The Actions tab alone went
# unread for three red nights (BOU-250, BOU-290).

on:
  schedule:
    # 03:17 UTC — off the hour, because everything on the hour queues behind
    # everyone else's cron. Scheduled runs only ever use the default branch.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run (e.g. pre-release check for 1.0.0-beta-5)'
        required: false
        default: 'manual'

concurrency:
  group: first-run-matrix
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke — ${{ matrix.image }}
    runs-on: ubuntu-latest
    # One distro failing must not hide the others. The whole point of a matrix
    # is knowing which cells are red, not that some cell was.
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - fedora:41
          # amd64-only, which is why running this from Apple Silicon needs
          # SMOKE_PLATFORM and emulation. GitHub runners are x86_64, so here it
          # is native and cheap — the one thing CI does better than a laptop.
          - archlinux:latest

    steps:
      - uses: actions/checkout@v6

      # No Clojure/Java setup on purpose. The test runs inside a bare container
      # and installs everything through scripts/install.sh; running it on the
      # runner would skip the branches where BOU-226's blockers lived, and pass
      # while proving nothing.
      - name: First-run smoke
        env:
          SMOKE_IMAGE: ${{ matrix.image }}
        run: ./scripts/first-run-smoke.sh

  smoke-released:
    name: Smoke — released tag (visitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The same script, pointed at the published tag instead of this checkout.
      # Every other job here — and `First-Run Smoke` in ci.yml — rewrites the
      # generated project's com.wagoe pins to :local/root, which is the one
      # configuration in which a stale release passes. 1.0.0-beta-5 shipped the
      # pre-BOU-319 dev/user.clj and told users to run (status), which did not
      # resolve; it also shipped BOU-401. Both were reported by users, not by CI
      # (BOU-402).
      #
      # One image. This cell varies the ARTIFACTS, not the distro — distro
      # coverage is the matrix above, and repeating it here would triple the
      # runtime to re-test install.sh a third time.
      #
      # Expect this to be red between a defect landing on main and the release
      # that carries the fix. That is the signal, not noise: it measures the gap
      # between what main does and what a `curl | bash` user gets today.
      - name: First-run smoke (released)
        env:
          SMOKE_IMAGE: ubuntu:24.04
          SMOKE_TARGET: released
        run: ./scripts/first-run-smoke.sh

  # BOU-414 lived in the seam these two measure: `bb setup --ai-provider <x>`
  # enables a module the generated deps.edn did not carry, and only a boot with
  # the provider switched on can notice. Ollama, because it needs no secret —
  # wiring is what boots, no call is made. The pair reads as: worktree green =
  # main is fixed; released red = the published tag still bricks this path.
  smoke-ai:
    name: Smoke — AI enabled (worktree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: First-run smoke (AI enabled)
        env:
          SMOKE_IMAGE: ubuntu:24.04
          SMOKE_AI: ollama
        run: ./scripts/first-run-smoke.sh

  smoke-released-ai:
    name: Smoke — AI enabled (released tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Expected red between BOU-414 landing on main and the release carrying
      # it — same contract as smoke-released above: the gap is the signal.
      - name: First-run smoke (released, AI enabled)
        env:
          SMOKE_IMAGE: ubuntu:24.04
          SMOKE_TARGET: released
          SMOKE_AI: ollama
        run: ./scripts/first-run-smoke.sh

  adversarial:
    name: Adversarial — ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu and Fedora produce identical output here, which is what makes
        # any difference an install.sh defect rather than a distro quirk. Arch
        # is excluded: its pacman JVM step cannot run sandboxed in a container,
        # so the smoke job above pre-satisfies the JVM, and these cases are
        # about post-install behaviour anyway.
        image:
          - ubuntu:24.04
          - fedora:41

    steps:
      - uses: actions/checkout@v6

      - name: First-run adversarial cases
        env:
          ADV_IMAGE: ${{ matrix.image }}
        run: ./scripts/first-run-adversarial.sh

  preconditions:
    name: Preconditions — ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu and Fedora: the two images whose package managers can supply a
        # JDK 17 for the old-Java case. Arch ships one JDK and pacman cannot run
        # sandboxed here anyway, as the smoke job's note explains.
        image:
          - ubuntu:24.04
          - fedora:41

    steps:
      - uses: actions/checkout@v6

      - name: First-run preconditions
        env:
          PRE_IMAGE: ${{ matrix.image }}
        run: ./scripts/first-run-preconditions.sh

  matrix-summary:
    name: First-Run Matrix Passed
    runs-on: ubuntu-latest
    needs: [smoke, smoke-released, smoke-ai, smoke-released-ai, adversarial, preconditions]
    steps:
      - name: Summary
        run: |
          echo "First-run matrix passed."
          echo "  smoke:         ubuntu:24.04, fedora:41, archlinux:latest"
          echo "  smoke-released: ubuntu:24.04, published tag (BOU-402)"
          echo "  smoke-ai:      ubuntu:24.04, worktree + released, ollama enabled (BOU-414)"
          echo "  adversarial:   ubuntu:24.04, fedora:41  (8 cases, incl. bash/fish/zsh)"
          echo "  preconditions: ubuntu:24.04, fedora:41  (old JDK, no network)"
          echo
          echo "Not covered here, and not claimed to be: macOS, WSL2, a"
          echo "corporate proxy, and real-user observation. Those need machines"
          echo "and people this matrix does not have."

  # Scheduled runs only: a workflow_dispatch run has someone watching it.
  report-failure:
    name: Report nightly failure
    runs-on: ubuntu-latest
    needs: [smoke, smoke-released, smoke-ai, smoke-released-ai, adversarial, preconditions]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/nightly-failure-issue.sh fail

  report-recovery:
    name: Close nightly-failure issue
    runs-on: ubuntu-latest
    needs: [smoke, smoke-released, smoke-ai, smoke-released-ai, adversarial, preconditions]
    if: success() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Close the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/nightly-failure-issue.sh pass
