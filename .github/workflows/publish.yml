name: Publish to Clojars

# Releases are driven by an unprefixed semver tag (e.g. 1.0.1-alpha-29), matching
# the bb release flow and scripts/install.sh's /releases/latest lookup. Pushing
# such a tag builds every library from the *tagged commit* and deploys to Clojars,
# guarded so the tag can never disagree with the source version, and verified so a
# partial deploy fails loudly instead of silently shipping a half/stale release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.1-alpha-29). Defaults to libs/core/build.clj.'
        required: false
        type: string

  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

# The Create GitHub Release step needs write access to releases; the default
# GITHUB_TOKEN is read-only, which 403s ("Resource not accessible by integration").
# `checks: read` is for the CI guard below, which reads the check runs reported
# against the tagged commit.
permissions:
  contents: write
  checks: read

jobs:
  publish:
    name: Publish Libraries to Clojars
    # Publishing is gated by the `release` environment, which requires a
    # maintainer to approve the run before any step executes (BOU-248).
    #
    # This replaces `if: github.actor == 'thijs-creemers'`. That guard held the
    # right property — only a trusted human publishes — but expressed it as a
    # hardcoded personal login: no second maintainer could ever release, and it
    # would fail silently (job skipped, no error) if the account were renamed.
    #
    # Note what this is NOT: `github.repository_owner == 'wagoebv'` is always
    # true here, so it would read as a gate while gating nothing, handing
    # publish rights to anyone with write access. The environment keeps the
    # human-approval property while surviving renames and admitting more than
    # one maintainer.
    #
    # The Clojars credentials should live as *environment* secrets on `release`
    # rather than repository secrets, so no other workflow or branch can read
    # them. See the note in dev-docs/reference/publishing.adoc.
    environment: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # BOU-314: every other guard in this workflow protects the *shape* of the
      # release — the tag agrees with source (--check-versions), nothing is
      # half-published (--missing), everything landed (--verify). None of them
      # ask whether the code works.
      #
      # So a tag on a commit whose CI was red, or never ran at all, published 30
      # artifacts. Clojars coordinates are immutable: there is no recall, no
      # overwrite, and no way to walk it back other than burning a version
      # number. That asymmetry is why this runs first, before the ~10 minutes of
      # setup below — a release that must not happen should cost seconds.
      #
      # Reading the Checks API rather than re-running the suite is deliberate:
      # it gates on the *same* run branch protection already requires, so a
      # green merge and a green release mean the same thing. Re-running here
      # would double the runtime and, worse, could pass on a flake that the
      # recorded run had caught.
      - name: Guard — CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_CHECK: All Tests Passed
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          echo "Requiring a successful \"$SUMMARY_CHECK\" on $sha"

          # No `|| true`: an API failure must abort the release, not read as
          # "no successful run" and land in the same branch as a red CI. The
          # two need different messages — one is a broken token, the other is
          # broken code.
          statuses="$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
            -f "check_name=${SUMMARY_CHECK}" \
            -f per_page=100 \
            --jq '.check_runs[] | "\(.status):\(.conclusion // "no-conclusion")"')"

          if [ -z "$statuses" ]; then
            echo "::error::No \"$SUMMARY_CHECK\" run exists for $sha — CI never ran on this commit."
            echo ""
            echo "Publishing would ship 30 immutable Clojars coordinates built from"
            echo "source nothing has tested. Push the commit to a branch, open a PR,"
            echo "and re-tag once the pipeline is green."
            exit 1
          fi

          if ! printf '%s\n' "$statuses" | grep -qx 'completed:success'; then
            echo "::error::\"$SUMMARY_CHECK\" did not succeed on $sha."
            echo ""
            echo "Runs found for this commit:"
            printf '%s\n' "$statuses" | sed 's/^/  /'
            exit 1
          fi

          echo "\"$SUMMARY_CHECK\" passed on $sha — proceeding."

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1654
          bb: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-publish-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build shared UI CSS bundle
        run: npm run build:css:admin

      # Resolve the release version: explicit dispatch input, else the pushed tag,
      # else the source-of-truth in libs/core/build.clj.
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="$(grep -m1 'def version' libs/core/build.clj | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $version"

      # Guard: every lib's build.clj must equal the release version. Prevents the
      # 'version ahead of source' failure that froze a stale jar under an immutable
      # Clojars coordinate. Aborts before any deploy on mismatch.
      - name: Guard — source version matches the release
        run: bb deploy --check-versions "${{ steps.version.outputs.version }}"

      # Deploy only artifacts not yet on Clojars at this version. Clojars
      # coordinates are immutable, so a re-run after a partial/transient failure
      # must skip already-published libs (re-deploying them 409s and aborts the
      # whole run). --missing makes the publish idempotent and recoverable: on a
      # fresh release nothing is published so it deploys everything, and on a
      # re-run it ships only the stragglers. --verify below still gates on all 30.
      - name: Publish libraries (idempotent — skips already-published)
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: bb deploy --missing

      # Confirm every artifact actually landed on Clojars at this version; a
      # partial/failed deploy fails the workflow here.
      - name: Verify published artifacts
        run: bb deploy --verify

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          body: |
            ## Wagoe Framework ${{ steps.version.outputs.version }}

            All libraries published to Clojars.

            ```clojure
            com.wagoe/wagoe-platform {:mvn/version "${{ steps.version.outputs.version }}"}
            ```

            See [CHANGELOG.md](https://github.com/wagoebv/wagoe/blob/main/CHANGELOG.md) for details.
          draft: false
          # Never mark releases as prerelease: scripts/install.sh resolves
          # WAGOE_TAG via /releases/latest, which excludes prereleases —
          # an alpha marked prerelease is silently uninstallable (alpha-29
          # never became "latest" for exactly this reason).
          prerelease: false
          make_latest: "true"

      - name: Summary
        run: |
          echo "## ✅ Publish Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Version **${{ steps.version.outputs.version }}** — all libraries published to Clojars and verified." >> "$GITHUB_STEP_SUMMARY"
