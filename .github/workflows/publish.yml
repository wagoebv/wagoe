name: Publish to Clojars

# Releases are driven by an unprefixed semver tag (e.g. 1.0.1-alpha-29), matching
# the bb release flow and scripts/install.sh's /releases/latest lookup. Pushing
# such a tag builds every library from the *tagged commit* and deploys to Clojars,
# guarded so the tag can never disagree with the source version, and verified so a
# partial deploy fails loudly instead of silently shipping a half/stale release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.1-alpha-29). Defaults to libs/core/build.clj.'
        required: false
        type: string

  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

# Each job gets only what it needs (BOU-1017): publish reads checks for its CI
# guard; attest signs the installer's provenance (BOU-974) from a fresh checkout,
# running no third-party code; release alone writes the GitHub release.
permissions:
  contents: read

jobs:
  publish:
    name: Publish Libraries to Clojars
    # Publishing is gated by the `release` environment, which requires a
    # maintainer to approve the run before any step executes (BOU-248).
    #
    # This replaces `if: github.actor == 'thijs-creemers'`. That guard held the
    # right property — only a trusted human publishes — but expressed it as a
    # hardcoded personal login: no second maintainer could ever release, and it
    # would fail silently (job skipped, no error) if the account were renamed.
    #
    # Note what this is NOT: `github.repository_owner == 'wagoebv'` is always
    # true here, so it would read as a gate while gating nothing, handing
    # publish rights to anyone with write access. The environment keeps the
    # human-approval property while surviving renames and admitting more than
    # one maintainer.
    #
    # The Clojars credentials should live as *environment* secrets on `release`
    # rather than repository secrets, so no other workflow or branch can read
    # them. See the note in dev-docs/reference/publishing.adoc.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # BOU-314: every other guard in this workflow protects the *shape* of the
      # release — the tag agrees with source (--check-versions), nothing is
      # half-published (--missing), everything landed (--verify). None of them
      # ask whether the code works.
      #
      # So a tag on a commit whose CI was red, or never ran at all, published 30
      # artifacts. Clojars coordinates are immutable: there is no recall, no
      # overwrite, and no way to walk it back other than burning a version
      # number. That asymmetry is why this runs first, before the ~10 minutes of
      # setup below — a release that must not happen should cost seconds.
      #
      # Reading the Checks API rather than re-running the suite is deliberate:
      # it gates on the *same* run branch protection already requires, so a
      # green merge and a green release mean the same thing. Re-running here
      # would double the runtime and, worse, could pass on a flake that the
      # recorded run had caught.
      - name: Guard — CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_CHECK: All Tests Passed
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          echo "Requiring a successful \"$SUMMARY_CHECK\" on $sha"

          # Wait for a verdict rather than demanding one immediately. Both
          # workflows are triggered by the release: publish.yml by the tag push,
          # ci.yml by the push to main that the tag points at. Nothing orders
          # them, so the guard read an empty check list and reported "CI never
          # ran" while CI was queued — 1.0.0-beta-6 failed here at 09:19:09 and
          # the summary went green at 09:22:08, three minutes later.
          #
          # "Not finished" and "never started" were the same branch, which is
          # what made a timing accident indistinguishable from an untested
          # commit. Three outcomes now, and the wait only ever delays the two
          # that are already going to succeed:
          #
          #   completed:success  -> publish
          #   completed:<other>  -> fail NOW; a red run will not turn green
          #   absent/in progress -> keep looking, up to DEADLINE_MIN
          #
          # The safety property is unchanged: a commit whose CI never runs still
          # fails, it just costs the timeout to say so.
          DEADLINE_MIN=25
          INTERVAL=20
          deadline=$(( $(date +%s) + DEADLINE_MIN * 60 ))

          while :; do
            # No `|| true`: an API failure must abort the release, not read as
            # "no successful run" and land in the same branch as a red CI. The
            # two need different messages — one is a broken token, the other is
            # broken code.
            statuses="$(gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
              -f "check_name=${SUMMARY_CHECK}" \
              -f per_page=100 \
              --jq '.check_runs[] | "\(.status):\(.conclusion // "no-conclusion")"')"

            if printf '%s\n' "$statuses" | grep -qx 'completed:success'; then
              echo "\"$SUMMARY_CHECK\" passed on $sha — proceeding."
              break
            fi

            # A conclusion that is not success is final. Waiting out the
            # deadline would report a timeout for a run that already answered,
            # and send the reader looking for a queue that is not there.
            decided="$(printf '%s\n' "$statuses" | grep '^completed:' || true)"
            if [ -n "$decided" ]; then
              echo "::error::\"$SUMMARY_CHECK\" did not succeed on $sha."
              echo ""
              echo "Runs found for this commit:"
              printf '%s\n' "$statuses" | sed 's/^/  /'
              exit 1
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::\"$SUMMARY_CHECK\" reached no conclusion on $sha within ${DEADLINE_MIN}m."
              echo ""
              if [ -z "$statuses" ]; then
                echo "No run exists for this commit at all. Publishing would ship"
                echo "31 immutable Clojars coordinates built from source nothing"
                echo "has tested. Push the commit to a branch, open a PR, and"
                echo "re-tag once the pipeline is green."
              else
                echo "Runs found, none concluded:"
                printf '%s\n' "$statuses" | sed 's/^/  /'
                echo ""
                echo "CI is stuck or far slower than usual. Re-run this workflow"
                echo "once it finishes — the tag does not need to move."
              fi
              exit 1
            fi

            echo "  ${statuses:-no run yet}; waiting ${INTERVAL}s ($(( (deadline - $(date +%s)) / 60 ))m left)"
            sleep "$INTERVAL"
          done

      # The released artifacts are compiled here, so this job answers for the
      # JDK baseline more than any CI job does. Without it `bb deploy` ran
      # `clojure -T:build` on whatever the runner image defaults to.
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.6.1673

      # bb runs `bb deploy` with the Clojars credentials, and its release
      # assets can be replaced upstream: fetched by digest, not by version.
      - name: Install Babashka
        run: |
          curl -fsSL -o /tmp/bb.tgz https://github.com/babashka/babashka/releases/download/v1.13.229/babashka-1.13.229-linux-amd64.tar.gz
          echo "a98c90a0530943dfa9a0b03bcccbc2030777a6ce094af303d5bb47d77e193299  /tmp/bb.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/bb.tgz -C "$HOME/.local/bin" bb
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-publish-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build shared UI CSS bundle
        run: npm run build:css

      # Resolve the release version: explicit dispatch input, else the pushed tag,
      # else the source-of-truth in libs/core/build.clj.
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="$(grep -m1 'def version' libs/core/build.clj | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          # A tag or input is text a shell would run: only a version gets through
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'; then
            echo "::error::not a version: $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $version"

      # Guard: every lib's build.clj must equal the release version. Prevents the
      # 'version ahead of source' failure that froze a stale jar under an immutable
      # Clojars coordinate. Aborts before any deploy on mismatch.
      - name: Guard — source version matches the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bb deploy --check-versions "$VERSION"

      # Every release closes the known security issues (BOU-899): none open in
      # Linear, check:vulns green on this commit, and a ### Security section in
      # the version's CHANGELOG entry. Before anything reaches Clojars.
      - name: Guard — no open security issue, no known vulnerability
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bb release:check "$VERSION"

      # Deploy only artifacts not yet on Clojars at this version. Clojars
      # coordinates are immutable, so a re-run after a partial/transient failure
      # must skip already-published libs (re-deploying them 409s and aborts the
      # whole run). --missing makes the publish idempotent and recoverable: on a
      # fresh release nothing is published so it deploys everything, and on a
      # re-run it ships only the stragglers. --verify below still gates on all 30.
      - name: Publish libraries (idempotent — skips already-published)
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: bb deploy --missing

      # Confirm every artifact actually landed on Clojars at this version; a
      # partial/failed deploy fails the workflow here.
      - name: Verify published artifacts
        run: bb deploy --verify

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## ✅ Publish Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Version **$VERSION** — all libraries published to Clojars and verified." >> "$GITHUB_STEP_SUMMARY"

  # A fresh checkout of the tag, so what is signed is the committed installer,
  # not a file the publish job's third-party setup could have touched.
  attest:
    name: Attest the installer
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The hash comes from the same release, so it shows the download is
      # intact, not that it is ours; a signed attestation does (BOU-974).
      - name: Attest the installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: scripts/install.sh

  release:
    name: Create GitHub Release
    needs: [publish, attest]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The installer and its SHA-256, so a user can check what they run (BOU-938).
      - name: Hash the installer
        run: cd scripts && sha256sum install.sh > install.sh.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.publish.outputs.version }}
          files: |
            scripts/install.sh
            scripts/install.sh.sha256
          body: |
            ## Wagoe Framework ${{ needs.publish.outputs.version }}

            All libraries published to Clojars.

            ```clojure
            com.wagoe/wagoe-platform {:mvn/version "${{ needs.publish.outputs.version }}"}
            ```

            See [CHANGELOG.md](https://github.com/wagoebv/wagoe/blob/main/CHANGELOG.md) for details.
          draft: false
          # scripts/install.sh installs /releases/latest, which skips
          # prereleases. A version with a stage (1.1.0-rc-1) is a prerelease,
          # so it never replaces the last final release as what users install.
          prerelease: ${{ contains(needs.publish.outputs.version, '-') }}
          make_latest: ${{ contains(needs.publish.outputs.version, '-') && 'false' || 'true' }}
